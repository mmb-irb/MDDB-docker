# Prometheus stack to scrape metrics.
# Select the Prometheus role with PROMETHEUS_MODE in the root .env:
#   PROMETHEUS_MODE=local   -> central backend (monitoring host)
#   PROMETHEUS_MODE=remote  -> per-node agent (default)
# Enable the optional blackbox exporter with BLACKBOX_REPLICAS=1.
# Deploy (Swarm), from the repo root after sourcing the env:
#   set -a; source .env; set +a
#   docker stack deploy -c docker-compose.yml -c extensions/metrics.yml my_stack

networks:
  metrics_network:
    external: true

volumes:
  prometheus_data: {}

services:
  # Host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - '--path.procfs=/host/proc' # Mapping host proc to container /host/proc
      - '--path.sysfs=/host/sys'   # Mapping host sys to container /host/sys
      - '--path.rootfs=/rootfs'    # Mapping host root to container /rootfs
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Disable default collectors and enable only a few
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.filesystem'
      - '--collector.meminfo'
    pid: host
    networks:
      - metrics_network
  
  # Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # https://github.com/google/cadvisor/blob/master/docs/runtime_options.md
      - '--enable_metrics=cpu,disk,memory'
      - '--housekeeping_interval=10s'
      - '--docker_only'
      - '--store_container_labels=false'
    networks:
      - metrics_network

  # Prometheus — a single service that acts as either the central backend or a per-node
  # agent, selected at start by PROMETHEUS_MODE (local | remote).
  #   local  = central backend: scrapes the local stack, accepts remote_write, basic_auth
  #            on all HTTP endpoints via prometheus-web.yml.
  #   remote = node agent: scrapes the local node and remote_writes to PROM_URL
  #            with PROM_USER / PROM_PASS credentials.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./metrics/exporters/prometheus-local.yml:/etc/prometheus/prometheus-local.yml:ro
      - ./metrics/exporters/prometheus-remote.yml:/etc/prometheus/prometheus-remote.yml:ro
      - ./metrics/exporters/prometheus-blackbox.yml:/etc/prometheus/prometheus-blackbox.yml:ro
      - ./metrics/exporters/prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus
    environment:
      - NODE=${NODE}  # expanded into external_labels via expand-external-labels
      - PROMETHEUS_MODE=${PROMETHEUS_MODE:-remote}
      - BLACKBOX_REPLICAS=${BLACKBOX_REPLICAS:-0}
      - PROM_URL=${PROM_URL}
      - PROM_USER=${PROM_USER}
      - PROM_PASS=${PROM_PASS}
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # host 9090 forwarded to container 9090 (default Prometheus port)
      - "9090:9090"
    networks:
      - metrics_network

  # Blackbox exporter
  # Optional: not deployed by default. Set BLACKBOX_REPLICAS=1 in the root .env to enable
  # (Swarm-compatible on/off switch, since `docker stack deploy` ignores Compose profiles).
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./metrics/exporters/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    deploy:
      replicas: ${BLACKBOX_REPLICAS:-0}
    networks:
      - metrics_network
