global:
  scrape_interval: 5m

# Optional extra scrape jobs (Prometheus >= 2.43). The blackbox job lives in
# prometheus-blackbox.yml; the entrypoint in extensions/metrics.yml copies it into this
# directory only when the blackbox exporter is enabled (BLACKBOX_REPLICAS=1). When the
# exporter is not deployed the directory is empty, so the job is simply absent instead of
# permanently DOWN.
scrape_config_files:
  - /tmp/prometheus/scrape_configs/*.yml

scrape_configs:
  # Scrape the state of the central Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Scrape Loki metrics (local monitoring stack health)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Scrape local node-exporter for central monitoring stack host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: 'central'
          owner: 'monitoring'

  # Scrape local cAdvisor for central container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          node: 'central'

# IMPORTANT: All application node metrics arrive via remote_write from each node's Prometheus
# into this central Prometheus (remote write receiver enabled in docker-compose).
# The 'node' and 'owner' labels added by each node's Prometheus config let you filter per machine.
