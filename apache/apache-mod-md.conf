
# Let's Encrypt with mod_md and the tls-alpn-01 challenge: only port 443 has to be reachable from the internet.
# Added to the configuration only when the image is built with CERT_METHOD=mod_md.
# mod_md only gets and renews the certificate in its store (certs/md/); apache keeps serving
# le_fullchain.pem / le_privkey.pem, and scripts/renew-certs.py copies a new certificate there and reloads apache.
LoadModule watchdog_module /usr/local/apache2/modules/mod_watchdog.so
LoadModule md_module /usr/local/apache2/modules/mod_md.so
MDStoreDir /usr/local/apache2/conf/ssl/md
MDCertificateAuthority CERT_ACME_URL
MDCertificateAgreement accepted
MDContactEmail CERT_EMAIL
MDCAChallenges tls-alpn-01
# The vhosts use their own certificate files, so mod_md must renew even if it does not serve the certificate
MDRenewMode always
MDomain CERT_DOMAINS
Protocols http/1.1 acme-tls/1
