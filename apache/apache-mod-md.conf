# Let's Encrypt certificate, managed by apache itself with mod_md (always on, see readme/storage.md#certificates).
# Added by the Dockerfile to every configuration that terminates TLS (has "SSLEngine on").
# mod_md gets the certificate for the names in MDomain, serves it in every https vhost whose ServerName or
# ServerAlias is one of them, and renews it before it expires. Until the first certificate arrives it serves a temporary self-signed one.
# A new certificate is activated by a graceful restart, which httpd-md-foreground does as soon as there is one.
LoadModule watchdog_module /usr/local/apache2/modules/mod_watchdog.so
LoadModule md_module /usr/local/apache2/modules/mod_md.so
MDStoreDir /usr/local/apache2/conf/ssl/md
MDCertificateAuthority CERT_ACME_URL
MDCertificateAgreement accepted
MDContactEmail CERT_EMAIL
# mod_md uses the first challenge it can set up (and does not switch if it fails). TLS-ALPN-01 needs port 443 reaching
# this apache with TLS untouched (directly or through a TCP/SNI passthrough proxy); HTTP-01 needs port 80.
MDCAChallenges CERT_CHALLENGES
# Apache listens inside the container on the outer port numbers
MDPortMap http:APACHE_HTTP_OUTER_PORT https:APACHE_HTTPS_OUTER_PORT
MDomain CERT_DOMAINS
Protocols http/1.1 acme-tls/1
